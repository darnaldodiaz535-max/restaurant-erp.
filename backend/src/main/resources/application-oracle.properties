# Configura estas variables en el entorno antes de usar el perfil Oracle.
# Ejemplo de URL: jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.url=${ORACLE_JDBC_URL}
spring.datasource.username=${ORACLE_DB_USER}
spring.datasource.password=${ORACLE_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-init-sql=ALTER SESSION DISABLE PARALLEL DML
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
